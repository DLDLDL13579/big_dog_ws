# LCM Bridge 配置
# UpBoard: 10.0.0.6 (enP8p1s0 直连)

lcm_url: "udpm://239.255.76.67:7667?ttl=255&ifname=enP8p1s0"
upboard_ip: "10.0.0.6"
upboard_port: 3333

# LCM 频道名（与 UpBoard 发布的一致）
lcm_channels:
  odometry: "global_to_robot"
  imu: "state_estimator"
  joints: "spi_data"

# TF frame names
frames:
  odom: "odom"
  base_link: "base_link"

# ROS2 topic names
topics:
  odom: "/odom"
  # R21: 只供 Nav2 控制器读取 twist；不替代 FAST-LIO /Odometry 和 TF。
  nav_odom: "/nav_odom"
  imu: "/upboard/state_estimator"
  joint_states: "/joint_states"
  cmd_vel: "/cmd_vel"
