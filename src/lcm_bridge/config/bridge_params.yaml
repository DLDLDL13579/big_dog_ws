# LCM Bridge 配置
# UpBoard TCP 指令地址（请根据实际网络修改）

lcm_url: "udpm://239.255.76.67:7667?ttl=255"
upboard_ip: "192.168.1.100"       # TODO: UpBoard 实际 IP
upboard_port: 3333

# LCM 频道名（与 UpBoard 发布的一致）
lcm_channels:
  odometry: "global_to_robot"      # localization_lcmt → /odom (核心定位来源)
  imu: "state_estimator"            # state_estimator_lcmt → /upboard/state_estimator (滤波后状态, 非原始IMU)
  joints: "spi_data"                # spi_data_t → /joint_states

# TF frame names
frames:
  odom: "odom"
  base_link: "base_link"

# ROS2 topic names
topics:
  odom: "/odom"
  imu: "/upboard/state_estimator"   # 滤波后状态 (姿态+角速度+加速度), 非原始 IMU
  joint_states: "/joint_states"
  cmd_vel: "/cmd_vel"
