# Nav2 3D 导航参数 — z1w_v2 机械狗 V1.0-3D
#
# 运动模型: 差分 vx + wz, vy=0 (四轮固定方向)
# 代价地图: voxel_layer (3D 点云 → 2D 投影) + inflation_layer
# 3D 源:
#   - Livox Mid-360: Z>0.2m, 1.5~5m → 宏观避障
#   - D435i depth:   Z>0.1m, 0.7~3m → 近距补盲
# 物理盲区: 0~0.7m → UpBoard 触地反馈兜底
#
# 定位方案: FAST-LIO-Localization (ICP 3D 全局定位)
#   map → odom TF 由 fast_lio_localization 四件套提供
#   (global_map_publisher + fastlio_mapping + global_localization + transform_fusion)
#   ⚠️ 已移除 AMCL 2D 粒子滤波定位 (scan_topic=/scan 无人发布, 3D 雷达/深度相机无 2D scan)
#
# ─── 调参记录 (单变量类轮次) ───
# R1 2026-08-26: 仅 DWB critics 权重 (治"贴边/擦障"): 
#   BaseObstacle 1.5→8.0 (加强障碍排斥), PathAlign 32→16, GoalAlign 24→12 (降贴路径强度)
#   FAST-LIO/体素层/膨胀层未动
# ★ R1 重大发现: Humble yaml 通配符不展平嵌套命名空间, 此前平铺写法 
#   FollowPath.BaseObstacle.scale 从未生效, DWB 一直跑默认全 1.0 权重!
#   已改为嵌套写法 FollowPath.dwb_critics::BaseObstacle.scale (ros2 param get 验证生效)
# R1 实车结果(2026-08-26): 2.0m 直线目标 6s 平滑完成, 目视确认实走约 2.3m, 无停摆 ✅
# R2 2026-08-26: 仅膨胀层 (治终点停摆/高代价区过大): inflation_radius 0.45→0.30
#   (局部+全局代价地图同步改, cost_scaling_factor 保持 2.5 不动, 单变量隔离归因)
# R3 2026-08-27: 体素层 z 窗口扩展 (治避障失明)
#   origin_z -0.2→-2.0, z_resolution 0.1→0.3, z_voxels 16 → 覆盖 -2.0~2.8m
#   站立时传感器 z≈1.85m(odom系), 旧窗口-3.0~1.8m 上界不够→raytrace 失败
#   趴姿时传感器 z≈0.15m(odom系), -2.0 下界足够
#   同步放宽 observation_source 的 min_obstacle_height 为 -2.0
#   注意: VoxelGrid 硬限制 z_voxels<=16, 用 z_resolution 补偿范围
# R4 2026-08-27: 体素层 z 窗口收紧+垂直分辨率翻倍 (基于 drift_test 实测数据定窗)
#   origin_z -2.0→-0.75, z_resolution 0.30→0.15, z_voxels 16 → 覆盖 -0.75~1.65m
#   跨度 2.4m / 0.15 = 16 体素, 恰好满足 VoxelGrid z_voxels<=16 硬限制
#   同步收紧 observation_source 的 min/max_obstacle_height 为 -0.75/1.65 (局部+全局同步改)
#   实测验证(drift_test 352s, 趴→站→遥控两圈→趴回原地, 闭环误差0.17m):
#   净漂移 -0.042m, z 范围 [-0.118, +0.705](趴下≈-0.05, 站立≈+0.45, 峰值+0.71为步态起伏)
#   → 下界余量 0.63m, 上界余量 0.94m, 窗口安全
#   ★ R3 注释中"站立传感器 z≈1.85m"是旧栈 33min 失同步的病态值, 正常工况不可复现

bt_navigator:
