controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /Odometry
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.3
      stateful: true

    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: -0.75
      max_vel_x: 0.45
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.35
      min_speed_xy: 0.0
      max_speed_xy: 0.45
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.3
      transform_tolerance: 0.5
      critics:
        - dwb_critics::BaseObstacle
        - dwb_critics::GoalAlign
        - dwb_critics::GoalDist
        - dwb_critics::PathAlign
        - dwb_critics::PathDist
        - dwb_critics::PreferForward
      # ★ Humble 嵌套命名空间写法 (平铺写法不生效, R1 实测验证):
      dwb_critics::BaseObstacle:
        scale: 8.0
        sum_scores: false   # Humble 默认 true 会对全轨迹点求和, 导致轨迹动辄判死→卡住不走; false=取最差单点罚分, 避障更平滑稳定 (R2 预设)
      dwb_critics::GoalAlign:
        scale: 12.0
      dwb_critics::GoalDist:
        scale: 24.0
      dwb_critics::PathAlign:
        scale: 16.0
      dwb_critics::PathDist:
        scale: 32.0
      dwb_critics::PreferForward:
        scale: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      transform_tolerance: 5.0
      footprint: "[[0.45,0.25],[0.45,-0.25],[-0.45,-0.25],[-0.45,0.25]]"
      footprint_padding: 0.05
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.30
        cost_scaling_factor: 2.5
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        voxel_size: 0.05
        publish_voxel_map: true
        origin_z: -0.75
        z_resolution: 0.15
        z_voxels: 16
        max_obstacle_height: 1.65
        min_obstacle_height: -0.75
        unknown_threshold: 15
        mark_threshold: 2
        observation_sources: livox_scan  # ★ 2026-08-27: camera_scan 禁用 (D435i 硬件故障)
        combination_method: 1
        livox_scan:
          topic: /cloud_registered_body
          max_obstacle_height: 1.65
          min_obstacle_height: -0.75
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2
          raytrace_max_range: 5.5
          raytrace_min_range: 0.0
          clearing: true
          marking: true
          data_type: PointCloud2
          expected_update_rate: 0.3
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 0.5
      always_send_full_costmap: true
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      resolution: 0.05
      transform_tolerance: 5.0
      footprint: "[[0.45,0.25],[0.45,-0.25],[-0.45,-0.25],[-0.45,0.25]]"
      footprint_padding: 0.05
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.30
        cost_scaling_factor: 2.5
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        voxel_size: 0.05
        publish_voxel_map: false
        origin_z: -0.75
        z_resolution: 0.15
        z_voxels: 16
        max_obstacle_height: 1.65
        min_obstacle_height: -0.75
        unknown_threshold: 15
        mark_threshold: 2
        observation_sources: livox_scan
        combination_method: 1
        livox_scan:
          topic: /cloud_registered_body
          max_obstacle_height: 1.65
          min_obstacle_height: -0.75
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2
          raytrace_max_range: 5.5
          raytrace_min_range: 0.0
          clearing: true
          marking: true
          data_type: PointCloud2
          expected_update_rate: 0.5

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    use_sim_time: false
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: /local_costmap/costmap_raw
    global_costmap_topic: /global_costmap/costmap_raw
    local_footprint_topic: /local_costmap/published_footprint
    global_footprint_topic: /global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    wait:
      plugin: nav2_behaviors/Wait

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: false
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 10.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.75, 0.0, 1.5]
    min_velocity: [-0.75, 0.0, -1.5]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: "/Odometry"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
